name: Validate

# A build and contract gate rather than a behavioural one.
#
# `pnpm check` is the full gate, and CI runs all of it **except `verify:bundle`**:
# that one reads the locally installed DSH's `app.asar` to compare the bundle's
# resolved externals, so it only runs on a machine with DSH — which is also where
# a release is cut. Everything else in the gate is pure Node, including the
# browser probes: they stand up their own fake environment rather than driving a
# live DSH, so they are safe to run here.
#
# The probes that DO drive a live instance (`probe:settings-card`,
# `probe:cross-group`, `probe:row-key-motion` and friends) are not in `pnpm check`
# and are not run here; they are hand-run against a real DSH.
on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref. Without this a same-repo feature branch triggers both a `push` and a
# `pull_request` run, and every further push to an open PR stacks another full six-leg matrix
# instead of superseding it.
#
# `cancel-in-progress` is off for `main` on purpose: a run on main is the record that the
# branch is green, so a later push must queue behind it rather than cancel it. On any other ref
# the newer commit is the one worth testing.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Install, typecheck, build, thirteen verify scripts and the probe bundle, across six
    # legs with `fail-fast: false`. Several probes stand up fake environments or wait on IPC,
    # so a hung one would otherwise occupy runners until GitHub's 6-hour default cap — and with
    # fail-fast off, all six legs would hang in parallel.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # tsdown 0.22 requires ^22.18.0 || >=24.11.0, so neither older Node 22 nor Node 23 is
        # usable here.
        #
        # The leg is 22.19.0, not 22.18.0: `engines` declares `^22.19.0 || >=24.0.0`, and a CI
        # leg **below** the declared floor does not test the floor — pnpm without `engine-strict`
        # installs anyway, so it would have passed while proving nothing about supported
        # runtimes. This is the lowest version the manifest actually claims.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to a commit SHA rather than the mutable `v4`
      # tag, so a tag move cannot change what runs here. The trailing comment
      # records the human-readable version; update both together.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check the sources
        run: pnpm run typecheck
      - name: Build the node and client bundles
        run: pnpm run build
      - name: Assert the committed bundles are in sync with src/
        # The build is deterministic, so a dirty `lib/` here means a source change was committed
        # without its regenerated artifact.
        #
        # This is a **script, not an inline `run:` block**, and that is the fix for a real CI
        # failure rather than a style preference. It used to be bash here (`set -euo pipefail`,
        # `CHANGED="$(git status --porcelain -- lib/)"`, `if [ -n "$CHANGED" ]`), but this job's
        # matrix includes **windows-latest**, where GitHub Actions runs `run:` under `pwsh` by
        # default. PowerShell cannot parse `if [ -n "$CHANGED" ]; then` and died with a
        # `ParserError` before executing a single command, so **both Windows legs failed on every
        # run** — and the failure read as a bundle-drift report while actually being a shell
        # mismatch. The signal this step exists to produce was missing from a third of the matrix.
        #
        # `scripts/verify-bundles.mjs` has no shell dependency and matches every other step in
        # this file, which already calls `pnpm run <script>`.
        #
        # What it asserts, unchanged: `git status --porcelain` rather than
        # `git diff --exit-code -- lib/` (the latter sees only *tracked* files, so a build that
        # emitted a brand-new artifact — or deleted one — reported clean, and `lib/` is what
        # `files` ships), and the output is tested rather than the command chained, because
        # `git status --porcelain` always exits 0.
        run: pnpm run verify:bundles
      - name: Verify the vendored patch ledger
        # Every patch id must still match a row, and the official ui-workspace
        # row must still be disabled rather than replaced.
        run: pnpm run verify:patch
      - name: Verify the grouping seam
        run: pnpm run verify:grouping
      - name: Verify the client seat registration
        # The phase-2 gate: it imports the built client under a fresh module instance per case
        # and asserts the seat registry, so it catches a slot registered against the wrong face
        # or a seat that stops being re-seated on install.
        #
        # Absent from this workflow until now, like `verify:host-import` below — the header
        # promised "all of `pnpm check` except `verify:bundle`", and two members of it were
        # running on no runner. The step list is now checked against `scripts.check` rather than
        # maintained by hand; `verify:client-seats` is the one most likely to be forgotten
        # again, because it is the newest.
        run: pnpm run verify:client-seats
      - name: Verify New Session placement
        run: pnpm run verify:new-session
      - name: Verify the project model
        run: pnpm run verify:projects
      - name: Verify the Host surface
        run: pnpm run verify:project-host
      - name: Verify directory handling
        run: pnpm run verify:project-directories
      - name: Verify the injected runtime context
        run: pnpm run verify:project-injection
      - name: Verify document specs
        run: pnpm run verify:doc-spec
      - name: Verify the locale dictionaries
        # zh/en key parity, placeholder parity, and no unreferenced key.
        run: pnpm run verify:locales
      - name: Verify the release facts
        # Version agreement across package.json / CHANGELOG / tarball name,
        # locale descriptions matching the feature set, the two READMEs staying
        # structurally equal, and `files` covering what ships.
        run: pnpm run verify:release
      - name: Verify the host bundle imports
        # Part of `pnpm check`, and one of the pure-Node contract checks — it loads the built
        # `lib/index.js` and asserts every bare specifier resolves, which is what catches a
        # decorator or specifier that typechecks and builds but fails at DSH load time.
        #
        # It was simply absent from this workflow while the header above promised CI runs the
        # whole gate "except `verify:bundle`", so that check ran on no runner at all.
        run: pnpm run verify:host-import
      - name: Run the self-contained probes
        run: pnpm run probe
