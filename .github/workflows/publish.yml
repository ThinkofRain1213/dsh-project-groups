name: Publish npm

# Publishes through npm Trusted Publishing (OIDC): no long-lived token is stored
# in this repository, and the artifact carries a provenance attestation that
# names this workflow and this commit.
#
# The npm side must be configured once for the package before this workflow can
# publish. On https://www.npmjs.com/package/dsh-project-groups/access add a
# trusted publisher with:
#
#   Organization or user   ThinkofRain1213
#   Repository             dsh-project-groups
#   Workflow filename      publish.yml
#   Environment name       (leave empty)
#   Allowed actions        [x] Allow npm publish
#
# ⚠️ That last box must be ticked. Configurations created after 2026-09-03
# default to allowing only `npm stage publish`, and this workflow runs
# `npm publish`. A newly created configuration must also complete its first
# successful publish within two days, or it expires and has to be recreated.
#
# npm has no "pending publisher" concept, so the very first release of a package
# has to be published by hand; every release after that can go through here.
#
# ## Why there is no `environment:` approval gate
#
# A protected environment would put a human approval between a Release and the
# publish, which is a real hardening step — and it was considered. It is not used
# here because `Environment name` is part of the trusted-publisher identity on the
# npm side: adding one here means re-configuring the package on npmjs.com with the
# same name, through a browser and a WebAuthn prompt. Doing that to gate a workflow
# whose only trigger is **publishing a Release** — itself an authenticated, manual
# act — buys little: the approval would be granted by the same person, seconds
# after the act that already authorized the publish.
#
# What the review actually flagged was that every matching tag could mint an
# attestation "with no human approval gate". The gate is the Release: this workflow
# runs on `release: published`, and `workflow_dispatch` requires a tag that already
# resolves to a **non-draft** release — asserted in the first step below. Tag pushes
# do not reach it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing non-draft GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish trusted npm release
    runs-on: ubuntu-latest
    # `id-token: write` is granted on the job rather than the workflow: only this
    # job publishes, so a step added elsewhere in the workflow cannot mint an OIDC
    # token for the trusted publisher as a side effect of running.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$RELEASE_TAG"; fi
          test -n "$TAG"
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r .draft <<<"$RELEASE_JSON")" = "false"
          test "$(jq -r .tag_name <<<"$RELEASE_JSON")" = "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      # Pinned to a commit SHA, not `@v4`: this job holds `id-token: write` and
      # publishes a signed artifact, so a moved tag in a third-party action would
      # run injected code in a step that can mint an OIDC token for the trusted
      # publisher — i.e. publish as this package. The trailing comment records the
      # human-readable version; update both together.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.5.1
      - name: Verify tag matches package version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$VERSION"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check the sources
        run: pnpm run typecheck
      - name: Build the node and client bundles
        run: pnpm run build
      - name: Assert the committed bundles are in sync with src/
        run: git diff --exit-code -- lib/
      - name: Verify the release facts
        # The same gate a release is cut under, minus `verify:bundle` — that one
        # needs a locally installed DSH's app.asar, which a runner does not have.
        run: pnpm run verify:release
      - name: Check whether this version is already published
        id: existing
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          set +e
          OUTPUT="$(npm view "${NAME}@${VERSION}" version 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' <<<"$OUTPUT"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$OUTPUT" >&2
            exit "$STATUS"
          fi
      - name: Publish through npm OIDC
        if: steps.existing.outputs.skip != 'true'
        # `--ignore-scripts` skips `prepublishOnly` (= `pnpm check`), and it is
        # required here rather than merely convenient: that gate runs
        # `verify:bundle`, which reads a **locally installed DSH's `app.asar`** to
        # compare resolved externals, and no runner has one. Publishing from a
        # machine with DSH still runs the full gate; this workflow cannot.
        #
        # What that gives up is covered rather than waved away. The steps above
        # already type-check, build, and assert the committed `lib/` matches
        # `src/`; `validate.yml` runs every remaining script **except**
        # `verify:bundle` on this same commit, on three platforms. So the only
        # assertion not made anywhere is the externals comparison, which is a
        # property of the vendored copy rather than of this release.
        #
        # The tarball is built from the committed `lib/`, never from a build this
        # job performs — `files` ships `lib`, and the sync check above is what
        # makes that safe.
        run: npm publish --access public --provenance --tag latest --ignore-scripts
      - name: Report idempotent skip
        if: steps.existing.outputs.skip == 'true'
        run: echo 'The exact package version already exists; no duplicate publish was attempted.'
