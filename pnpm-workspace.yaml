# pnpm install settings for this repository — deliberately **not** a workspace.
#
# There is no `packages:` list because there are no workspace projects: this is a single-package
# repository (one manifest, one lockfile), and this file exists only to carry the two settings
# below. Adding `packages: ['.']` would declare a one-project workspace, which changes pnpm's
# resolution and hoisting behaviour for no benefit. Recorded so the absence reads as a decision
# rather than an unfinished monorepo definition.
#
# `virtualStoreDirMaxLength: 60`: the default store path length overflows the Windows MAX_PATH
# budget for this dependency tree, whose packages carry long scoped names.
virtualStoreDirMaxLength: 60

# Release-age exemptions.
#
# `minimumReleaseAge` normally holds a package back until it is old enough to have been vetted;
# these are exempt because the whole `@deepseek-ai/dsh-*` set is published in lockstep and pinned
# to the exact prerelease `0.2.1-rc.2` — there is no older, "safer" version of any of them to
# wait for.
#
# The five trailing `@deepseek-ai/cordis*`, `cosmokit` and `schemastery` entries are a different
# reason: DSH 0.2.1 requires `cordis ~4.0.5`, and pnpm adds those to this list itself when
# their release is too fresh to clear the age gate. They are kept here explicitly because
# `pnpm install` re-appends them otherwise, and an append lands at the end — past the sort order
# this file is asserted on.
#
# ⚠️ **Coupled to the lockfile.** Every entry hard-codes its resolved version, so bumping the DSH
# version without updating this list makes `pnpm install` fail the release-age check for dozens of
# packages at once, with an error that does not name the cause.
#
# The list must cover every `@deepseek-ai/dsh-*` package pnpm **resolves** — which is the whole
# lockfile set, not just `package.json`'s direct dependencies: 72 of the 76 DSH entries below are
# transitive. `verify:release` asserts set and version equality against the lockfile, so the two
# cannot drift silently, and asserts the sort order too.
#
# Sorted by **package name**, so a base package precedes its suffixed siblings
# (`dsh-session-format` before `dsh-session-format-catalog`). A plain string sort would not: the
# `@` that ends the name sorts after the `-` that begins the suffix. Strict order is what makes a
# dropped entry visible in review rather than merely absent.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cordis-plugin-group@1.0.5'
  - '@deepseek-ai/cordis-plugin-loader@1.0.6'
